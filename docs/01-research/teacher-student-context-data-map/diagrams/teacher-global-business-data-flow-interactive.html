:root[data-theme=&quot;light&quot;] {

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans) !important;
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {

}

h2 {

  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {

  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {

  padding: 1px 6px;

  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 6px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);

.text-small,
.viz-badge {

.text-muted {

}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;

.btn:is(.btn-block, .viz-tile) {

  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;

.btn-primary .text-muted {

  background: color-mix(in srgb, var(--foreground) 80%, transparent);

  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

  opacity: 0.4;

[data-lucide] {

  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);

.form-control:focus-visible {

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {

.btn:not(.btn-primary, .viz-tile):is(

.btn:focus-visible {

}

@media (pointer: coarse) {

  .form-select {

&lt;body&gt;
&lt;div id=&quot;teacher-business-data-flow-v1&quot;&gt;

  &lt;p class=&quot;text-small text-muted&quot;&gt;圆面积 ≈ 当前教师上下文矩阵中的语义字段组数量；数字不是业务数据行数。虚线节点表示“已有业务定义、当前不可直接查询”。&lt;/p&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;teacher-business-data-flow-v1&#x27;);
    const stage = root.querySelector(&#x27;.teacher-flow-stage&#x27;);
    const svg = root.querySelector(&#x27;svg&#x27;);

    const nodes = [
      { id: &#x27;identity&#x27;, title: [&#x27;账号 / 身份&#x27;], fields: 8, key: &#x27;uid · identity_id&#x27;, scene: &#x27;subject&#x27;, lane: 0 },
      { id: &#x27;institution&#x27;, title: [&#x27;机构成员&#x27;, &#x27;与权限&#x27;], fields: 16, key: &#x27;school_uid · st_id&#x27;, scene: &#x27;subject&#x27;, lane: 0 },
      { id: &#x27;course&#x27;, title: [&#x27;班级 / 角色&#x27;], fields: 16, key: &#x27;course_id&#x27;, scene: &#x27;subject&#x27;, lane: 0 },
      { id: &#x27;lesson&#x27;, title: [&#x27;课节 / 排课&#x27;], fields: 13, key: &#x27;class_id&#x27;, scene: &#x27;teaching&#x27;, lane: 1 },
      { id: &#x27;classroom&#x27;, title: [&#x27;课堂参与&#x27;, &#x27;与评价&#x27;], fields: 15, key: &#x27;class_id + uid&#x27;, scene: &#x27;teaching&#x27;, lane: 1 },
      { id: &#x27;lms&#x27;, title: [&#x27;LMS 活动&#x27;, &#x27;与学习证据&#x27;], fields: 55, key: &#x27;activity_id → biz_type + biz_id&#x27;, scene: &#x27;teaching&#x27;, lane: 1 },
      { id: &#x27;todo&#x27;, title: [&#x27;统一待办&#x27;], fields: 6, key: &#x27;当前无标准视图&#x27;, scene: &#x27;teaching&#x27;, lane: 2, unavailable: true },
      { id: &#x27;im&#x27;, title: [&#x27;IM / 沟通&#x27;], fields: 19, key: &#x27;clusterid · message_key&#x27;, scene: &#x27;collaboration&#x27;, lane: 2 },
      { id: &#x27;resource&#x27;, title: [&#x27;空间 / 文件&#x27;], fields: 12, key: &#x27;file_id · folder_id + auth&#x27;, scene: &#x27;collaboration&#x27;, lane: 2 },
      { id: &#x27;ai-history&#x27;, title: [&#x27;既有 AI&#x27;, &#x27;会话历史&#x27;], fields: 14, key: &#x27;agent_id · session_id&#x27;, scene: &#x27;ai&#x27;, lane: 2 }
    ];

    const edges = [
      [&#x27;identity&#x27;, &#x27;institution&#x27;, &#x27;&#x27;],
      [&#x27;institution&#x27;, &#x27;course&#x27;, &#x27;&#x27;],
      [&#x27;course&#x27;, &#x27;lesson&#x27;, &#x27;&#x27;],
      [&#x27;lesson&#x27;, &#x27;classroom&#x27;, &#x27;&#x27;],
      [&#x27;classroom&#x27;, &#x27;lms&#x27;, &#x27;&#x27;],
      [&#x27;course&#x27;, &#x27;im&#x27;, &#x27;班级沟通范围&#x27;],
      [&#x27;course&#x27;, &#x27;resource&#x27;, &#x27;班级资源范围&#x27;],
      [&#x27;lms&#x27;, &#x27;todo&#x27;, &#x27;按状态推导&#x27;],
      [&#x27;lms&#x27;, &#x27;resource&#x27;, &#x27;教学产物&#x27;],
      [&#x27;im&#x27;, &#x27;ai-history&#x27;, &#x27;连续性证据&#x27;]
    ];

    function radius(fields) {
      return 16 + 5.5 * Math.sqrt(fields);
    }

    function el(name, attrs = {}, text = &#x27;&#x27;) {
      const node = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, name);
      Object.entries(attrs).forEach(([key, value]) =&gt; node.setAttribute(key, value));
      if (text) node.textContent = text;
      return node;
    }

    function curvePath(a, b, mobile) {
      const ar = a.r;
      const br = b.r;
      if (mobile) {
        const y1 = a.y + ar;
        const y2 = b.y - br;
        const mid = (y1 + y2) / 2;
        return `M ${a.x} ${y1} C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${y2}`;
      }
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.max(1, Math.hypot(dx, dy));
      const x1 = a.x + dx / len * ar;
      const y1 = a.y + dy / len * ar;
      const x2 = b.x - dx / len * br;
      const y2 = b.y - dy / len * br;
      const bend = Math.abs(dy) &gt; 45 ? 0.55 : 0.5;
      const cx1 = x1 + (x2 - x1) * bend;
      const cy1 = y1;
      const cx2 = x1 + (x2 - x1) * (1 - bend);
      const cy2 = y2;
      return `M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`;
    }

    function draw() {
      const width = Math.max(320, Math.floor(stage.getBoundingClientRect().width));
      const mobile = width &lt; 560;
      const map = new Map();
      let height;

      if (mobile) {
        const order = [&#x27;identity&#x27;, &#x27;institution&#x27;, &#x27;course&#x27;, &#x27;lesson&#x27;, &#x27;classroom&#x27;, &#x27;lms&#x27;, &#x27;todo&#x27;, &#x27;im&#x27;, &#x27;resource&#x27;, &#x27;ai-history&#x27;];
        const startY = 70;
        const step = 132;
        order.forEach((id, index) =&gt; {
          const item = nodes.find(node =&gt; node.id === id);
          map.set(id, { ...item, x: width / 2, y: startY + index * step, r: radius(item.fields) });
        });
        height = startY + order.length * step + 150;
      } else {
        const xs3 = [width * 0.18, width * 0.5, width * 0.82];
        const xs4 = [width * 0.12, width * 0.37, width * 0.62, width * 0.86];
        const positions = {
          identity: [xs3[0], 95], institution: [xs3[1], 95], course: [xs3[2], 95],
          lesson: [xs3[0], 285], classroom: [xs3[1], 285], lms: [xs3[2], 285],
          todo: [xs4[0], 485], im: [xs4[1], 485], resource: [xs4[2], 485], &#x27;ai-history&#x27;: [xs4[3], 485]
        };
        nodes.forEach(item =&gt; {
          map.set(item.id, { ...item, x: positions[item.id][0], y: positions[item.id][1], r: radius(item.fields) });
        });
        height = 690;
      }

      svg.replaceChildren();
      svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`);
      svg.setAttribute(&#x27;height&#x27;, height);

      const defs = el(&#x27;defs&#x27;);
      const marker = el(&#x27;marker&#x27;, { id: &#x27;teacher-flow-arrow-v1&#x27;, markerWidth: 8, markerHeight: 8, refX: 7, refY: 4, orient: &#x27;auto&#x27;, markerUnits: &#x27;strokeWidth&#x27; });
      marker.appendChild(el(&#x27;path&#x27;, { d: &#x27;M 0 0 L 8 4 L 0 8 z&#x27;, fill: &#x27;var(--border)&#x27; }));
      defs.appendChild(marker);
      svg.appendChild(defs);

      if (!mobile) {
        const laneLabels = [
          [&#x27;01  主体与组织&#x27;, 25],
          [&#x27;02  教学运行&#x27;, 215],
          [&#x27;03  沟通与延展&#x27;, 415],
          [&#x27;04  AI 上下文装配&#x27;, 610]
        ];
        laneLabels.forEach(([label, y]) =&gt; {
          svg.appendChild(el(&#x27;text&#x27;, { x: 8, y, class: &#x27;lane-label&#x27; }, label));
          svg.appendChild(el(&#x27;line&#x27;, { x1: 118, y1: y - 4, x2: width - 8, y2: y - 4, class: &#x27;lane-rule&#x27; }));
        });
      }

      edges.forEach(([from, to, label]) =&gt; {
        const a = map.get(from);
        const b = map.get(to);
        const path = el(&#x27;path&#x27;, {
          d: curvePath(a, b, mobile),
          class: `edge${from === &#x27;lms&#x27; &amp;&amp; to === &#x27;todo&#x27; ? &#x27; secondary&#x27; : &#x27;&#x27;}`,
          &#x27;marker-end&#x27;: &#x27;url(#teacher-flow-arrow-v1)&#x27;
        });
        svg.appendChild(path);
        if (label &amp;&amp; !mobile) {
          svg.appendChild(el(&#x27;text&#x27;, {
            x: (a.x + b.x) / 2,
            y: (a.y + b.y) / 2 - 8,
            class: &#x27;edge-label&#x27;,
            &#x27;text-anchor&#x27;: &#x27;middle&#x27;
          }, label));
        }
      });

      nodes.forEach(item =&gt; {
        const p = map.get(item.id);
        const group = el(&#x27;g&#x27;, { class: `node ${item.scene}${item.unavailable ? &#x27; unavailable&#x27; : &#x27;&#x27;}` });
        const circle = el(&#x27;circle&#x27;, { cx: p.x, cy: p.y, r: p.r });
        group.appendChild(circle);

        const titleStart = p.y - (item.title.length === 2 ? 13 : 6);
        item.title.forEach((line, index) =&gt; {
          group.appendChild(el(&#x27;text&#x27;, { x: p.x, y: titleStart + index * 15, class: &#x27;node-title&#x27; }, line));
        });
        group.appendChild(el(&#x27;text&#x27;, { x: p.x, y: p.y + (item.title.length === 2 ? 24 : 17), class: &#x27;node-value&#x27; }, `${item.fields} 字段组`));
        group.appendChild(el(&#x27;text&#x27;, { x: p.x, y: p.y + p.r + 18, class: &#x27;key-label&#x27;, &#x27;text-anchor&#x27;: &#x27;middle&#x27; }, item.key));
        svg.appendChild(group);
      });

    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    clearOpenTimeout();

  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger

      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0

    if (delay === 0) {
      openTooltip(trigger);

    openTimeout = window.setTimeout(() =&gt; {

      pendingTrigger = null;

    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);

  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
